name: Trend Sniper Bot

on:
  schedule:
    - cron: '*/15 4-9 * * 1-5'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install yfinance
        pip install pandas
        pip install requests
        pip install pyotp
        pip install smartapi-python
        echo "All packages installed successfully"
        python -c "import pyotp; import smartapi; print('Imports verified!')"

    - name: Run Trend Sniper Bot
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        AO_CLIENT_ID: ${{ secrets.AO_CLIENT_ID }}
        AO_PASSWORD: ${{ secrets.AO_PASSWORD }}
        AO_TOTP_SECRET: ${{ secrets.AO_TOTP_SECRET }}
        AO_API_KEY: ${{ secrets.AO_API_KEY }}
      run: python trend_sniper.py

    - name: Save Diary (Commit changes)
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add trades.json
        git commit -m "Update trades diary" || echo "No changes"
        git push
